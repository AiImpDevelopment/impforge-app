# SPDX-License-Identifier: MIT
[workspace]
resolver = "2"
members = [
    "src-tauri",
    "digiimp",
    "crates/rrf",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["ImpForge Maintainers <hello@impforge.com>"]
homepage = "https://impforge.com"
repository = "https://github.com/AiImpDevelopment/impforge-app"

[workspace.dependencies]
# impforge-cli workspace crates (path deps + version pin for cargo-deny;
# version matches impforge-cli workspace.package.version = "0.1.0")
impforge-core = { path = "../impforge-cli/crates/impforge-core", version = "0.1.0" }
impforge-models = { path = "../impforge-cli/crates/impforge-models", version = "0.1.0" }
impforge-mcp-server = { path = "../impforge-cli/crates/impforge-mcp-server", version = "0.1.0" }
impforge-emergence = { path = "../impforge-cli/crates/impforge-emergence", version = "0.1.0" }
impforge-autonomy = { path = "../impforge-cli/crates/impforge-autonomy", version = "0.1.0" }
impforge-crown-jewel = { path = "../impforge-cli/crates/impforge-crown-jewel", version = "0.1.0" }
impforge-universal = { path = "../impforge-cli/crates/impforge-universal", version = "0.1.0" }
impforge-bench = { path = "../impforge-cli/crates/impforge-bench", version = "0.1.0" }
impforge-remote = { path = "../impforge-cli/crates/impforge-remote", version = "0.1.0" }

# Reciprocal Rank Fusion — local workspace crate, MIT, zero deps.  Future-shareable
# across CLI + Pro.  Hybrid retrieval is THE moat the major editor-AIs (Cursor,
# Continue) don't ship even paid; we ship it free.
rrf = { path = "crates/rrf", version = "0.1.0-alpha" }

# Document Upload + RAG — Feature 2 (Tier 2).  All MIT-compatible.
# - rusqlite 0.39: SQLite + bundled FTS5 (built into core, no separate feature
#   flag).  We enable `vtab` + `modern_sqlite` for FTS5 trigram tokeniser.
# - lopdf 0.40: pure-Rust PDF text extraction.
# - pdfium-render 0.9: native-bound, used ONLY for citation preview rendering
#   (page bitmap with chunk highlight).  Falls back to lopdf if pdfium not
#   present — we don't make pdfium a hard dep.
# - calamine 0.34: pure-Rust XLSX/XLS reader (read-only, perfect for our
#   text-extraction use-case).
# - docx-rs 0.4.20: pure-Rust DOCX reader.
# - pulldown-cmark 0.13: CommonMark + GFM, used to strip Markdown to plain text.
# - scraper 0.26: html5ever-backed CSS-selector HTML parser (MIT/Apache-2.0).
# - whatlang 0.18: pure-Rust language detection (MIT).  3-grams over 87 langs.
# - sha2 / walkdir: dedup hash + recursive ingest.
# rusqlite 0.31 pins libsqlite3-sys = "^0.28" which matches what sqlx-sqlite
# 0.8.0 requires.  Using the latest rusqlite (0.39, libsqlite3-sys ^0.37)
# triggers a `links = "sqlite3"` conflict with sqlx that cargo refuses.
# 0.31's API is identical for FTS5 virtual-table use.
rusqlite = { version = "0.31", features = ["bundled", "vtab", "modern_sqlite"] }
lopdf = "0.40"
pdfium-render = "0.9"
calamine = "0.34"
docx-rs = "0.4"
pulldown-cmark = "0.13"
scraper = "0.26"
whatlang = "0.18"
sha2 = "0.10"
walkdir = "2"

# Global Digest — Feature 3 (Tier 2).  All MIT-compatible.
# Same rationale as in the CLI workspace; see crates/impforge-cli/Cargo.toml
# (workspace.dependencies) for full notes on each crate.  Tier 2 adds
# `arboard` for opt-in clipboard ingest.
notify = "8"
notify-debouncer-full = "0.7"
arboard = "3"
feed-rs = "2"
url = "2"

# MCP Plugin UI — Feature 4 (Tier 2).  All MIT-compatible.
# - `oauth2` 5 = canonical PKCE + loopback redirect client.  We use the
#   sync API (`reqwest` blocking is already a dep via marketplace sync).
# - `landlock` 0.4 = Linux 5.13+ filesystem capability gate.  No-op on
#   non-Linux platforms (handled in code).
# - `seccompiler` 0.5 = compile a seccomp BPF policy at runtime to lock
#   per-server allowed syscalls.  Linux-only.
oauth2 = "5"
landlock = "0.4"
seccompiler = "0.5"

# Code Interpreter Sandbox — Feature 5 (Tier 2).
# - `wasmtime` 27 = pinned to 27.0.0 to match impforge-cli's MSRV-1.80
#   commitment.  We don't take 37+ in App because 37 needs Rust 1.87
#   and 43 needs newer; pinning to 27 lets ALL three tiers share one
#   wasmtime version + one cache.  WASIp3 stream/future is a Tier-3
#   (Pro) feature and falls back to chunked polling here.
# - `wasmtime-wasi` 27 = matched WASI bindings.
# - `rquickjs` 0.11 = pure-Rust QuickJS bindings (MIT).  Used to run
#   user-supplied JavaScript in the sandbox.
# - `wat` 1 = WAT → binary compiler used in unit tests.
# - License: Apache-2.0 WITH LLVM-exception (wasmtime), MIT (rquickjs).
wasmtime = { version = "27", default-features = false, features = ["runtime", "wat", "cranelift", "std"] }
wasmtime-wasi = "27"
rquickjs = { version = "0.11", default-features = false, features = ["macro", "loader"] }
wat = "1"

# Tauri 2.x — versions checked against crates.io 2026-04-19
# NOTE: api-all feature was Tauri 1; Tauri 2 splits into per-API capabilities (opt-in later)
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"

# DigiImp rendering — locked per 2026-04-19-digiimp-rust-rendering-research.md
wgpu = "29.0.1"
winit = "0.30"
rive-rs = "0.6"
bytemuck = "1.21"
glam = "0.30"
tauri-plugin-decorum = "1"

# Async / IO
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sqlx — sqlite-only, default-features disabled.  Why default-features = false:
#   sqlx 0.8 defaults include "any" + "macros" + "migrate" + "json", and "any"
#   enables AnyDriver which pulls sqlx-mysql + sqlx-postgres → rsa 0.9.x →
#   RUSTSEC-2023-0071 (Marvin Attack timing sidechannel).  With default-features
#   = false we explicitly opt-in to sqlite + tokio-rustls, eliminating the rsa
#   dep at the root.  Verified: cargo audit reports 0 vulns after this change.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
ollama-rs = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
