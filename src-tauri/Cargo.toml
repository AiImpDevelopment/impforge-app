# SPDX-License-Identifier: MIT
[package]
name = "impforge-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Open-source freemium Tauri+Svelte+Rust desktop app for local-first AI work."

[lib]
name = "impforge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
ollama-rs = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

# impforge-cli workspace crates
impforge-core = { workspace = true }
impforge-models = { workspace = true }
impforge-mcp-server = { workspace = true }
impforge-emergence = { workspace = true }
impforge-autonomy = { workspace = true }
impforge-crown-jewel = { workspace = true }
impforge-universal = { workspace = true }
impforge-bench = { workspace = true }
impforge-remote = { workspace = true }

# Multi-provider BYOK chat — Feature 1 (Tier 2/3).
# Same versions as crates/impforge-cli/Cargo.toml for binary-size + audit reasons.
genai = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Document Upload + RAG — Feature 2 (Tier 2).  Pure-Rust ingest pipeline +
# RRF hybrid retrieval.  See workspace.dependencies for rationale.
rrf = { workspace = true }
rusqlite = { workspace = true }
lopdf = { workspace = true }
pdfium-render = { workspace = true }
calamine = { workspace = true }
docx-rs = { workspace = true }
pulldown-cmark = { workspace = true }
scraper = { workspace = true }
whatlang = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
base64 = "0.22"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
