# SPDX-License-Identifier: MIT
[package]
name = "impforge-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Open-source freemium Tauri+Svelte+Rust desktop app for local-first AI work."

[lib]
name = "impforge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
ollama-rs = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }

# impforge-cli workspace crates
impforge-core = { workspace = true }
impforge-models = { workspace = true }
impforge-mcp-server = { workspace = true }
impforge-emergence = { workspace = true }
impforge-autonomy = { workspace = true }
impforge-crown-jewel = { workspace = true }
impforge-universal = { workspace = true }
impforge-bench = { workspace = true }
impforge-remote = { workspace = true }

# Multi-provider BYOK chat — Feature 1 (Tier 2/3).
# Same versions as crates/impforge-cli/Cargo.toml for binary-size + audit reasons.
genai = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Document Upload + RAG — Feature 2 (Tier 2).  Pure-Rust ingest pipeline +
# RRF hybrid retrieval.  See workspace.dependencies for rationale.
rrf = { workspace = true }
rusqlite = { workspace = true }
lopdf = { workspace = true }
pdfium-render = { workspace = true }
calamine = { workspace = true }
docx-rs = { workspace = true }
pulldown-cmark = { workspace = true }
scraper = { workspace = true }
whatlang = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
base64 = "0.22"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
once_cell = "1"

# Global Digest — Feature 3 (Tier 2).  See workspace.dependencies for
# rationale.  `arboard` carries clipboard support for the OPT-IN
# clipboard digest source; disabled by default per the Recall lesson.
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
arboard = { workspace = true }
feed-rs = { workspace = true }
url = { workspace = true }

# MCP Plugin UI — Feature 4 (Tier 2).
# - oauth2 = PKCE flow for OAuth-required MCP servers (GitHub, Slack)
# - landlock = Linux 5.13+ filesystem capability gate (best-effort)
# - seccompiler = Linux seccomp-BPF policy compiler (best-effort)
oauth2 = { workspace = true }
landlock = { workspace = true }
seccompiler = { workspace = true }

# tempfile = WAL-copy of locked browser SQLite DBs (Firefox / Chrome).
# Used by `browser_import_oneshot::open_locked_sqlite`.  Must be in
# main deps (not dev-deps) because it's compiled into production code.
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"
