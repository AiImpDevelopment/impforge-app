# SPDX-License-Identifier: MIT
# cargo-audit configuration for impforge-app.
#
# All ignores match deny.toml's [advisories] ignore list — both tools must
# stay in sync. Each ignore is documented inline + tracks an upstream issue.
[advisories]
ignore = [
  # Tauri GTK3 runtime (transitive, awaiting Tauri gtk4-rs migration)
  "RUSTSEC-2024-0411",  # gdkwayland-sys
  "RUSTSEC-2024-0412",  # gdk
  "RUSTSEC-2024-0413",  # atk
  "RUSTSEC-2024-0414",  # gdkx11-sys
  "RUSTSEC-2024-0415",  # gtk
  "RUSTSEC-2024-0416",  # atk-sys
  "RUSTSEC-2024-0417",  # gdkx11
  "RUSTSEC-2024-0418",  # gdk-sys
  "RUSTSEC-2024-0419",  # gtk3-macros
  "RUSTSEC-2024-0420",  # gtk-sys
  "RUSTSEC-2024-0370",  # proc-macro-error (gtk-rs glib-macros)
  # urlpattern unic-* chain (transitive via tauri-utils)
  "RUSTSEC-2025-0075",  # unic-char-range
  "RUSTSEC-2025-0080",  # unic-common
  "RUSTSEC-2025-0081",  # unic-char-property
  "RUSTSEC-2025-0098",  # unic-ucd-version
  "RUSTSEC-2025-0100",  # unic-ucd-ident
  # hf-hub indicatif chain (transitive, display-only formatting)
  "RUSTSEC-2025-0119",  # number_prefix
  # fxhash (transitive, non-crypto hash)
  "RUSTSEC-2025-0057",
]
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "low"
